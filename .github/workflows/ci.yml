name: CI & Deployment Pipeline

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  frontend-check:
    name: Frontend Verification (Node 24, Vitest, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install, test, and build frontend
        run: cd web && npm ci && npm test -- --run && npm run build

  backend-check:
    name: Backend Verification (Java 25, Testcontainers, Verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Verify backend with Testcontainers
        run: cd server && chmod +x mvnw && ./mvnw clean verify -B

  docker-check:
    name: Docker Multi-Stage Build Smoke Check
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t toppa-load:ci .

  deploy-staging:
    name: Trigger Coolify Staging Webhook
    runs-on: ubuntu-latest
    needs: docker-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    steps:
      - name: Trigger Coolify Staging Deployment
        env:
          COOLIFY_STAGING_WEBHOOK_URL: ${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}
        run: |
          if [ -n "$COOLIFY_STAGING_WEBHOOK_URL" ]; then
            echo "Triggering Coolify Staging deployment webhook..."
            curl -fsSL -X POST "$COOLIFY_STAGING_WEBHOOK_URL"
            echo "Staging deployment webhook triggered successfully."
          else
            echo "COOLIFY_STAGING_WEBHOOK_URL secret is not set; skipping deployment."
          fi

  deploy-production:
    name: Trigger Coolify Production Webhook
    runs-on: ubuntu-latest
    needs: docker-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Coolify Production Deployment
        env:
          COOLIFY_PRODUCTION_WEBHOOK_URL: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -n "$COOLIFY_PRODUCTION_WEBHOOK_URL" ]; then
            echo "Triggering Coolify Production deployment webhook..."
            curl -fsSL -X POST "$COOLIFY_PRODUCTION_WEBHOOK_URL"
            echo "Production deployment webhook triggered successfully."
          else
            echo "COOLIFY_PRODUCTION_WEBHOOK_URL secret is not set; skipping deployment."
          fi
